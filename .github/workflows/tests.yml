name: tests

# Основная проверка — на сервере (deploy/autodeploy.sh гоняет тесты перед выкладкой),
# чтобы не зависеть от лимита минут GitHub Actions. Здесь — только ручной запуск.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lasererp
          POSTGRES_USER: lasererp
          POSTGRES_PASSWORD: lasererp
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: laser_erp.settings_prod
      DJANGO_SECRET_KEY: ci-only-not-secret
      POSTGRES_DB: lasererp
      POSTGRES_USER: lasererp
      POSTGRES_PASSWORD: lasererp
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Миграции применяются на Postgres (ловит конфликты вроде двух 0133)
        run: python manage.py migrate --noinput
      - name: Тесты
        run: python manage.py test --noinput
