# Nginx — Laser ERP
# Установка: sudo cp deploy/nginx/laser-erp.conf /etc/nginx/sites-available/laser-erp
#            sudo ln -sf /etc/nginx/sites-available/laser-erp /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx

upstream laser_erp_app {
    server 127.0.0.1:8001 fail_timeout=0;
}

server {
    listen 80;
    server_name laser-erp.armada.sx;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name laser-erp.armada.sx;

    client_max_body_size 25M;

    access_log /var/log/nginx/laser-erp.access.log;
    error_log /var/log/nginx/laser-erp.error.log;

    ssl_certificate /etc/letsencrypt/live/laser-erp.armada.sx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laser-erp.armada.sx/privkey.pem;
    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_ecdh_curve X25519:secp256r1:secp384r1;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /static/ {
        alias /var/www/laser-erp/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/laser-erp/media/;
        expires 1d;
    }

    location = /admin/login/ {
        limit_req zone=laser_login burst=5 nodelay;
        proxy_pass http://laser_erp_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location = /account/login/ {
        limit_req zone=laser_login burst=5 nodelay;
        proxy_pass http://laser_erp_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://laser_erp_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
