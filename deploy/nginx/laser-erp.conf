# Nginx — Laser ERP
# Установка: sudo cp deploy/nginx/laser-erp.conf /etc/nginx/sites-available/laser-erp
#            sudo ln -sf /etc/nginx/sites-available/laser-erp /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx

upstream laser_erp_app {
    server 127.0.0.1:8001 fail_timeout=0;
}

server {
    listen 80;
    server_name erp.example.ru;

    client_max_body_size 25M;

    access_log /var/log/nginx/laser-erp.access.log;
    error_log /var/log/nginx/laser-erp.error.log;

    location /static/ {
        alias /var/www/laser-erp/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/laser-erp/media/;
        expires 1d;
    }

    location / {
        proxy_pass http://laser_erp_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
