{% extends "core/base.html" %}
{% block title %}Принять приглашение в админку{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Приглашение в админку</h1>

        <p class="text-muted small mb-4">
          E-mail: <b>{{ invite.email }}</b><br>
          Роль: <b>{{ invite.get_role_display }}</b>
        </p>

        <form method="post">
          {% csrf_token %}
          {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}

          <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" name="password1" class="form-control" required minlength="8">
          </div>

          <div class="mb-3">
            <label class="form-label">Подтвердите пароль</label>
            <input type="password" name="password2" class="form-control" required minlength="8">
          </div>

          <button type="submit" class="btn btn-success w-100">Активировать доступ</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
