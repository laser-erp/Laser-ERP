{% extends "core/base.html" %}
{% block title %}Сброс пароля{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Сброс пароля</h1>
        <p class="text-muted small">Введите email, указанный при регистрации.</p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.email.id_for_label }}">Email</label>
            {{ form.email }}
            {% if form.email.errors %}<div class="text-danger small">{{ form.email.errors }}</div>{% endif %}
          </div>
          <button type="submit" class="btn btn-primary w-100">Отправить ссылку</button>
        </form>
        <p class="text-muted small mt-3 mb-0"><a href="{% url 'account_login' %}">Вернуться ко входу</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
