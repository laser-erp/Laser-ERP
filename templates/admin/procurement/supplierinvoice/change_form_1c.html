{% block content %}
<div class="si-shell">
  <div class="si-toolbar">
    <button type="button" class="button default" id="si-save-close">Провести и закрыть</button>
    <button type="button" class="button" id="si-save">Записать</button>
    <div class="si-more-wrap">
      <button type="button" class="button" id="si-more-btn">Еще ▾</button>
      <div class="si-more-menu" id="si-more-menu">
        <button type="button" id="si-more-ocr">OCR и разбор</button>
        <button type="button" id="si-more-print">Печать</button>
        <button type="button" id="si-more-history">История</button>
      </div>
    </div>
  </div>
  {{ block.super }}
</div>
<script>
  (function () {
    function displayFileName(rawName) {
      var text = (rawName || "").trim();
      if (!text) return "";
      text = text.replace(/\\/g, "/");
      var base = text.split("/").pop() || text;
      // Django FileField часто добавляет короткий случайный суффикс: _2vMgqQf.PDF
      base = base.replace(/_[A-Za-z0-9]{5,12}\.[A-Za-z0-9]{2,5}$/i, "");
      // Если случайного суффикса нет — просто убираем расширение.
      base = base.replace(/\.[A-Za-z0-9]{2,5}$/i, "");
      return base;
    }

    function submitWithAction(actionName) {
      var form = document.getElementById("supplierinvoice_form");
      if (!form) return;
      var marker = document.createElement("input");
      marker.type = "hidden";
      marker.name = actionName;
      marker.value = "1";
      form.appendChild(marker);
      form.submit();
    }
    function renderPurposeTablePreview(form) {
      function parseRuNumber(value) {
        var raw = (value || "").replace(/\s/g, "").replace(/\u00A0/g, "").replace(",", ".");
        var n = parseFloat(raw);
        return isNaN(n) ? null : n;
      }
      function extractAmountByLabel(text, labelRegex) {
        var src = (text || "").replace(/\r/g, "\n");
        var lines = src.split("\n");
        for (var i = 0; i < lines.length; i++) {
          var line = " " + (lines[i] || "") + " ";
          if (!labelRegex.test(line)) continue;
          var m = line.match(/(-?\d{1,3}(?:[ \u00A0]?\d{3})*(?:[.,]\d{1,2})|-?\d+(?:[.,]\d{1,2}))/g);
          if (m && m.length) {
            return parseRuNumber(m[m.length - 1]);
          }
        }
        return null;
      }
      function formatRuMoney(value) {
        var n = Number(value || 0);
        var fixed = n.toFixed(2).replace(".", ",");
        return fixed;
      }
      function moneyToWordsRu(value) {
        var n = Math.abs(Number(value || 0));
        var rub = Math.floor(n);
        var kop = Math.round((n - rub) * 100);
        if (kop === 100) {
          rub += 1;
          kop = 0;
        }
        var onesM = ["", "один", "два", "три", "четыре", "пять", "шесть", "семь", "восемь", "девять"];
        var onesF = ["", "одна", "две", "три", "четыре", "пять", "шесть", "семь", "восемь", "девять"];
        var teens = ["десять", "одиннадцать", "двенадцать", "тринадцать", "четырнадцать", "пятнадцать", "шестнадцать", "семнадцать", "восемнадцать", "девятнадцать"];
        var tens = ["", "", "двадцать", "тридцать", "сорок", "пятьдесят", "шестьдесят", "семьдесят", "восемьдесят", "девяносто"];
        var hundreds = ["", "сто", "двести", "триста", "четыреста", "пятьсот", "шестьсот", "семьсот", "восемьсот", "девятьсот"];
        function morph(num, one, few, many) {
          var n1 = num % 100;
          if (n1 >= 11 && n1 <= 19) return many;
          var n2 = num % 10;
          if (n2 === 1) return one;
          if (n2 >= 2 && n2 <= 4) return few;
          return many;
        }
        function triadToWords(num, female) {
          var out = [];
          var h = Math.floor(num / 100);
          var t = Math.floor((num % 100) / 10);
          var o = num % 10;
          if (h) out.push(hundreds[h]);
          if (t === 1) {
            out.push(teens[o]);
          } else {
            if (t > 1) out.push(tens[t]);
            if (o) out.push((female ? onesF : onesM)[o]);
          }
          return out.join(" ");
        }
        if (rub === 0) {
          return "Ноль рублей 00 копеек";
        }
        var parts = [];
        var millions = Math.floor(rub / 1000000);
        var thousands = Math.floor((rub % 1000000) / 1000);
        var rest = rub % 1000;
        if (millions) {
          parts.push(triadToWords(millions, false));
          parts.push(morph(millions, "миллион", "миллиона", "миллионов"));
        }
        if (thousands) {
          parts.push(triadToWords(thousands, true));
          parts.push(morph(thousands, "тысяча", "тысячи", "тысяч"));
        }
        if (rest) {
          parts.push(triadToWords(rest, false));
        }
        parts.push(morph(rub, "рубль", "рубля", "рублей"));
        var kopStr = String(kop).padStart(2, "0");
        parts.push(kopStr + " " + morph(kop, "копейка", "копейки", "копеек"));
        var s = parts.join(" ").replace(/\s+/g, " ").trim();
        return s.charAt(0).toUpperCase() + s.slice(1);
      }

      if (!form) return;
      var commentField = form.querySelector("#id_comment");
      if (!commentField) return;
      var financeFieldset = null;
      var sets = form.querySelectorAll("fieldset.module");
      sets.forEach(function (fs) {
        var h2 = fs.querySelector("h2");
        var t = h2 ? (h2.textContent || "").toLowerCase() : "";
        if (t.indexOf("финанс") >= 0) financeFieldset = fs;
      });
      var existing = (financeFieldset || form).querySelector("#si-purpose-table-preview");
      if (!existing) {
        existing = document.createElement("div");
        existing.id = "si-purpose-table-preview";
        existing.className = "si-purpose-table-wrap";
        existing.style.display = "none";
        if (financeFieldset) {
          financeFieldset.appendChild(existing);
        } else {
          commentField.insertAdjacentElement("afterend", existing);
        }
      }
      var raw = (commentField.value || "").replace(/\r/g, "\n");
      var lines = raw.split("\n").map(function (x) { return x.trim(); }).filter(Boolean);
      if (lines.length < 2 || lines[0].indexOf("|") < 0) {
        existing.style.display = "none";
        existing.innerHTML = "";
        return;
      }
      var rows = lines
        .filter(function (ln) { return ln.indexOf("|") >= 0; })
        .map(function (ln) {
          return ln.split("|").map(function (cell) { return cell.trim(); });
        });
      if (rows.length < 2) {
        existing.style.display = "none";
        existing.innerHTML = "";
        return;
      }
      var headerCols = Math.max(2, rows[0].length);
      rows = rows.map(function (r, idx) {
        var row = r.slice();
        if (row.length > headerCols) {
          // OCR can inject extra "|" inside item name; merge extras back into description column.
          if (headerCols >= 3) {
            var tailLen = headerCols - 2;
            var tailStart = Math.max(2, row.length - tailLen);
            var mergedName = row.slice(1, tailStart).join(" ").replace(/\s+/g, " ").trim();
            row = [row[0], mergedName].concat(row.slice(tailStart));
          } else {
            row = row.slice(0, headerCols);
          }
        }
        if (idx > 0 && row.length > 0 && row[0] === "" && /^\d+$/.test(row[1] || "")) {
          row[0] = row[1];
          row[1] = "";
        }
        while (row.length < headerCols) row.push("");
        return row;
      });
      var thead = "<thead><tr>" + rows[0].map(function (c) { return "<th>" + c + "</th>"; }).join("") + "</tr></thead>";
      var bodyRows = rows.slice(1).map(function (r) {
        return "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>";
      }).join("");
      var bodyOnly = rows.slice(1);
      var rowCount = bodyOnly.length;
      var total = 0;
      bodyOnly.forEach(function (r) {
        var last = r[r.length - 1] || "";
        var parsed = parseRuNumber(last);
        if (parsed !== null) total += parsed;
      });
      var ocrRaw = "";
      var ocrPreview = form.querySelector(".field-ocr_result_preview pre");
      if (ocrPreview) ocrRaw = ocrPreview.textContent || "";
      var vatAmount = extractAmountByLabel(ocrRaw, /в\s+том\s+числе\s+ндс/i);
      var payableAmount = extractAmountByLabel(ocrRaw, /всего\s+к\s+оплате/i);
      var totalAmount = extractAmountByLabel(ocrRaw, /(?:^|\s)итого[:\s]/i);

      var totalFinal = totalAmount !== null ? totalAmount : total;
      var payableFinal = payableAmount !== null ? payableAmount : totalFinal;
      var vatFinal = vatAmount !== null ? vatAmount : 0;

      var totalFixed = formatRuMoney(totalFinal);
      var payableFixed = formatRuMoney(payableFinal);
      var vatFixed = formatRuMoney(vatFinal);
      var words = moneyToWordsRu(payableFinal);
      existing.innerHTML =
        '<div class="si-purpose-table-inner">' +
          '<table class="si-purpose-table">' + thead + "<tbody>" + bodyRows + "</tbody></table>" +
          '<div class="si-purpose-summary">' +
            '<div class="si-purpose-summary-top">' +
              '<div class="si-purpose-totals">' +
                '<div class="si-purpose-totals-line"><span class="si-purpose-totals-label">Итого:</span><span class="si-purpose-totals-value">' + totalFixed + "</span></div>" +
                '<div class="si-purpose-totals-line"><span class="si-purpose-totals-label">В том числе НДС:</span><span class="si-purpose-totals-value">' + vatFixed + "</span></div>" +
                '<div class="si-purpose-totals-line"><span class="si-purpose-totals-label">Всего к оплате:</span><span class="si-purpose-totals-value">' + payableFixed + "</span></div>" +
              "</div>" +
            "</div>" +
            '<div class="si-purpose-summary-line">Всего наименований ' + rowCount + ', на сумму ' + totalFixed + ' руб.</div>' +
            '<div class="si-purpose-summary-line si-purpose-summary-words">' + words + "</div>" +
          "</div>" +
        "</div>";
      existing.style.display = "";
    }
    var saveClose = document.getElementById("si-save-close");
    var save = document.getElementById("si-save");
    var moreBtn = document.getElementById("si-more-btn");
    var moreMenu = document.getElementById("si-more-menu");
    var moreOcr = document.getElementById("si-more-ocr");
    var morePrint = document.getElementById("si-more-print");
    var moreHistory = document.getElementById("si-more-history");
    saveClose && saveClose.addEventListener("click", function () {
      var form = document.getElementById("supplierinvoice_form");
      if (form) {
        var statusInput = form.querySelector("#id_status");
        if (statusInput) {
          statusInput.value = "approved";
        }
        var marker = document.createElement("input");
        marker.type = "hidden";
        marker.name = "_conduct_close";
        marker.value = "1";
        form.appendChild(marker);
      }
      submitWithAction("_save");
    });
    save && save.addEventListener("click", function () { submitWithAction("_continue"); });
    moreBtn && moreBtn.addEventListener("click", function (e) {
      e.preventDefault();
      moreMenu && moreMenu.classList.toggle("is-open");
    });
    document.addEventListener("click", function (e) {
      if (!moreMenu || !moreBtn) return;
      if (!moreMenu.contains(e.target) && e.target !== moreBtn) {
        moreMenu.classList.remove("is-open");
      }
    });
    morePrint && morePrint.addEventListener("click", function () {
      window.print();
      moreMenu && moreMenu.classList.remove("is-open");
    });
    moreHistory && moreHistory.addEventListener("click", function () {
      var historyAnchor = document.querySelector(".object-tools .historylink");
      if (historyAnchor) {
        window.location.href = historyAnchor.getAttribute("href");
      }
    });

    var form = document.getElementById("supplierinvoice_form");
    if (!form) return;

    function bindCategorySubcategoriesHint(categoryControl) {
      var select = categoryControl ? categoryControl.querySelector("select") : null;
      if (!select) return;
      var subcategoriesByCategory = {
        rent: ["Эксплуатационные услуги"]
      };
      function updateHintTitle() {
        var selected = select.value || "";
        var subcats = subcategoriesByCategory[selected] || [];
        if (!subcats.length) {
          select.removeAttribute("title");
          return;
        }
        select.title = "Подкатегории:\n- " + subcats.join("\n- ");
      }
      select.addEventListener("change", updateHintTitle);
      select.addEventListener("mouseenter", updateHintTitle);
      select.addEventListener("focus", updateHintTitle);
      updateHintTitle();
    }

    renderPurposeTablePreview(form);
    var commentField = form.querySelector("#id_comment");
    if (commentField) {
      commentField.addEventListener("input", function () {
        renderPurposeTablePreview(form);
      });
    }
    var titleEl = document.querySelector("#content h1");
    if (titleEl && !titleEl.querySelector(".si-doc-title-meta")) {
      var titleNumber = "";
      var titleDate = "";
      var numberRow = form.querySelector(".field-number .readonly");
      if (numberRow) {
        titleNumber = (numberRow.textContent || "").trim();
      }
      var dateInput = form.querySelector(".field-invoice_date input");
      if (dateInput) {
        titleDate = (dateInput.value || "").trim();
      }
      if (titleNumber || titleDate) {
        var meta = document.createElement("strong");
        meta.className = "si-doc-title-meta";
        meta.textContent = "№ " + (titleNumber || "—") + (titleDate ? " от " + titleDate : "");
        titleEl.appendChild(meta);
      }
    }
    var fieldsets = form.querySelectorAll("fieldset.module");
    var mainSet = [];
    var ocrSet = [];
    function extractFieldFromRow(fs, fieldName, controlClass) {
      var row = fs.querySelector(".field-" + fieldName);
      if (!row) return null;
      var flex = row.querySelector(".laser-field-main-col .flex-container") || row.querySelector(".flex-container");
      if (!flex) return null;
      var labelEl = flex.querySelector("label");
      var control = document.createElement("span");
      control.className = controlClass;
      Array.prototype.slice.call(flex.children).forEach(function (child) {
        if (child !== labelEl) control.appendChild(child);
      });
      row.style.display = "none";
      return control;
    }
    function stabilizeDateShortcuts(control) {
      if (!control) return;
      var shortcuts = control.querySelector(".datetimeshortcuts");
      if (!shortcuts) return;
      shortcuts.dataset.siStable = "1";
    }
    fieldsets.forEach(function (fs) {
      var titleEl = fs.querySelector("h2");
      var title = titleEl ? titleEl.textContent.trim().toLowerCase() : "";
      if (title.indexOf("документ") >= 0) {
        fs.classList.add("si-doc-header");
        var fNumber = extractFieldFromRow(fs, "number", "si-doc-control");
        var fDate = extractFieldFromRow(fs, "invoice_date", "si-doc-control si-doc-control--date");
        var fStatus = extractFieldFromRow(fs, "status", "si-doc-control");
        var fCategory = extractFieldFromRow(fs, "expense_category", "si-doc-control");
        if (fNumber && fDate && fStatus && fCategory) {
          bindCategorySubcategoriesHint(fCategory);
          stabilizeDateShortcuts(fDate);
          var docLine = document.createElement("div");
          docLine.className = "si-doc-line";

          var lNum = document.createElement("span");
          lNum.className = "si-doc-label";
          lNum.textContent = "Номер:";
          docLine.appendChild(lNum);
          docLine.appendChild(fNumber);

          var sep = document.createElement("span");
          sep.className = "si-doc-sep";
          sep.textContent = "от";
          docLine.appendChild(sep);
          docLine.appendChild(fDate);

          var lStatus = document.createElement("span");
          lStatus.className = "si-doc-label";
          lStatus.textContent = "Статус:";
          docLine.appendChild(lStatus);
          docLine.appendChild(fStatus);

          var lCat = document.createElement("span");
          lCat.className = "si-doc-label";
          lCat.textContent = "Категория расходов:";
          docLine.appendChild(lCat);
          docLine.appendChild(fCategory);

          fs.appendChild(docLine);
        }
      }
      if (title.indexOf("контрагент") >= 0) {
        fs.classList.add("si-counterparty-row");
        var supplierControl = extractFieldFromRow(fs, "supplier", "si-counterparty-control");
        var ourOrgControl = extractFieldFromRow(fs, "our_organization", "si-counterparty-control");
        if (supplierControl && ourOrgControl) {
          var cpLine = document.createElement("div");
          cpLine.className = "si-counterparty-line";

          var sLabel = document.createElement("span");
          sLabel.className = "si-counterparty-label";
          sLabel.textContent = "Поставщик:";
          cpLine.appendChild(sLabel);
          cpLine.appendChild(supplierControl);

          var oLabel = document.createElement("span");
          oLabel.className = "si-counterparty-label";
          oLabel.textContent = "Наша организация:";
          cpLine.appendChild(oLabel);
          cpLine.appendChild(ourOrgControl);

          fs.appendChild(cpLine);
        }
      }
      if (title.indexOf("ocr") >= 0) {
        ocrSet.push(fs);
      } else {
        mainSet.push(fs);
      }
    });
    var ocrVisible = false;
    ocrSet.forEach(function (fs) { fs.style.display = "none"; });
    moreOcr && moreOcr.addEventListener("click", function () {
      ocrVisible = !ocrVisible;
      ocrSet.forEach(function (fs) { fs.style.display = ocrVisible ? "" : "none"; });
      moreOcr.textContent = ocrVisible ? "OCR и разбор (скрыть)" : "OCR и разбор";
      moreMenu && moreMenu.classList.remove("is-open");
    });

    var fileFlex = form.querySelector(".field-invoice_file .laser-field-main-col .flex-container");
    if (fileFlex) {
      var fileInput = fileFlex.querySelector("input[type='file']");
      var fileLink = fileFlex.querySelector("a[href]");
      var hasCustom = fileFlex.querySelector(".si-file-row");
      if (fileInput && !hasCustom) {
        fileInput.style.display = "none";
        var row = document.createElement("div");
        row.className = "si-file-row";

        var fileName = document.createElement("span");
        fileName.className = "si-file-name";
        fileName.textContent = fileLink
          ? (displayFileName(fileLink.textContent) || "Файл счета")
          : "Файл не приложен";
        row.appendChild(fileName);

        if (fileLink) {
          var openBtn = document.createElement("a");
          openBtn.className = "button";
          openBtn.href = fileLink.href;
          openBtn.target = "_blank";
          openBtn.textContent = "Открыть";
          row.appendChild(openBtn);
        }

        var replaceBtn = document.createElement("button");
        replaceBtn.type = "button";
        replaceBtn.className = "button";
        replaceBtn.textContent = "Изменить файл";
        replaceBtn.addEventListener("click", function () { fileInput.click(); });
        row.appendChild(replaceBtn);

        var pickedName = document.createElement("span");
        pickedName.className = "si-file-name";
        row.appendChild(pickedName);

        fileInput.addEventListener("change", function () {
          pickedName.textContent = fileInput.files && fileInput.files[0] ? fileInput.files[0].name : "";
        });

        Array.prototype.slice.call(fileFlex.children).forEach(function (child) {
          if (child !== fileInput) {
            child.style.display = "none";
          }
        });
        fileFlex.appendChild(row);
      }
    }
  })();
</script>
{% endblock %}
